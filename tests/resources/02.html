    <purs-div>
      <div class="section">
        <button onclick="FetchPurchases" class="btn ps-btn btn-outline-success">Button 2</button>
        <div class="div-outer">
          <div class="div-inner">
            <button onclick="FetchPurchases" class="btn ps-btn btn-outline-danger">Button 1</button>

        </div>
        <div class="div-outer-2">
          <button onclick="FetchPurchases" class="btn ps-btn btn-outline-success">Button 3</button>
          <purs-input data-name="ednum">
            <span class="form-group">
              <label class="ps-label ps-mr-1">Edition#
                <input type="text" class="form-control ps-input" onchange="EdNumChange"></label></span></purs-input>
          <purs-select data-name="edtype">
              <span class="form-group">
                <label class="ps-label ps-mr-1">Edition Type
                  <select onchange="IntervalChange" class="form-control ps-select">
                    <option value="-">-</option>
                    <option value="1">T.P.</option>
                    <option value="2">BAT</option>
                    <option value="3">M.E.</option>
                    <option value="4">E.A.</option>
                    <option value="5">H.C.</option>
                    <option value="6">S.P</option>
                    <option value="7">HCol</option>
                  </select></label></span>
          </purs-select>
          <purs-switch data-name="xprints">

          </purs-switch>
        </div>
